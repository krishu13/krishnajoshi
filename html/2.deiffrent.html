<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Difference Between p and h5</title>
</head>
<body>
    <center>
    <!-- h5 used as a small subsection title -->
    <h5>Course Prerequisites</h5>

    <!-- p used for the actual paragraph / descriptive text -->
    <p>Students should have a basic understanding of computer operations and file management before starting this web development module.</p>

    </center>
    <center>
    <!-- Another example -->
    <h5>Important Note</h5>
    <p>Make sure to save your work before closing the code editor.</p>
     </center>
</body>
</html>
