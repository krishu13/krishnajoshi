<head>

</head>

    <input type="number" min="1" max="100" placeholder="age">
    <br><br>
    <input type="date">
    <br><br>
    <input type="tal">
    <br><br>
    <input type="time">
    <br><br>
    <input type="datetime">
    <br><br>
    <input type="color">
    <br><br>
    <input type="range">
    <br><br>
    <input type="url" placeholder="website">
    <br><br>
    <input type="search" placeholder="mobile">
    <br><br>
     </center>
</body>
</html>
