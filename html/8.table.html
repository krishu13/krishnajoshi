<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Table</title>
  <style>
    table {
      border-collapse: collapse;
      font-family: sans-serif;
    }
    th, td {
      border: 1px solid #333;
      padding: 8px 12px;
      text-align: left;
    }
    th {
      background-color: #f2f2f2;
    }
  </style>
</head>
<body>
<center>
  <table>
    
    <tr>
      <th>No.</th>
      <th>Name</th>
      <th>City</th>
    </tr>
    <tr>
      <td>1</td>
      <td>Rahul</td>
      <td>Ahmedabad</td>
    </tr>
    <tr>
      <td>2</td>
      <td>Priya</td>
      <td>Surat</td>
    </tr>
    <tr>
      <td>3</td>
      <td>krishna</td>
      <td>rajkot</td>
    </tr>
    

  
  </table>
</center>

</body>
</html>
