<!DOCTYPE html>
<html>
<head>
    <title>Simple Horizontal Login in Table</title>
</head>
<body>

    <h3 align="center"><U>User Login</U></h3>

    <form action="#">
        <center>
        <table border="1" cellpadding="8" cellspacing="0">
            <tr>
                <td><b>Username:</b></td>
                <td><input type="text" placeholder="Enter Username"></td>

                <td><b>Password:</b></td>
                <td><input type="password" placeholder="Enter Password"></td>

                <td><input type="submit" value="Login"></td>

                <td><a href="#">reset password</a></td>
            </tr>
        </table>
        </center>
    </form>

</body>
</html>
