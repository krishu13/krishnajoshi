<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>All Bullet Types</title>
</head>
<body>

    <!-- 1. Default / Disc -->
    <h3>1. Disc Bullets (Default)</h3>
    <ul type="disc">
        <li>HTML</li>
        <li>CSS</li>
    </ul>

    <!-- 2. Circle -->
    <h3>2. Circle Bullets</h3>
    <ul type="circle">
        <li>JavaScript</li>
        <li>Python</li>
    </ul>

    <!-- 3. Square -->
    <h3>3. Square Bullets</h3>
    <ul type="square">
        <li>MySQL</li>
        <li>Data Science</li>
    </ul>

    <!-- 4. Nested / Sub-bullets -->
    <h3>4. Sub-bullets (List Inside a List)</h3>
    <ul>
        <li>Frontend Development
            <ul>
                <li>HTML5</li>
                <li>CSS3</li>
            </ul>
        </li>
        <li>Backend Development
            <ul>
                <li>Python</li>
                <li>MySQL</li>
            </ul>
        </li>
    </ul>

</body>
</html>
