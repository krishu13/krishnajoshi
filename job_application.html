<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Job Application Form</title>
</head>
<body>
<center>
    <h2><u> <b>Application Form</b></u></h2>

    <form action="#" method="post" enctype="multipart/form-data">
        <table border="1" cellpadding="8" cellspacing="0" bgcolor="#eeeee">
            <tr>
                <td><label for="fullname">Full Name:</label></td>
                <td><input type="text" id="fullname" name="fullname" required></td>
            </tr>
            <tr>
                <td><label for="email">Email Address:</label></td>
                <td><input type="email" id="email" name="email" required></td>
            </tr>
            <tr>
                <td><label for="phone">Phone Number:</label></td>
                <td><input type="tel" id="phone" name="phone" required></td>
            </tr>
            <tr>
                <td><label for="dob">Date of Birth:</label></td>
                <td><input type="date" id="dob" name="dob" required></td>
            </tr>
            <tr>
                <td>Gender:</td>
                <td>
                    <input type="radio" id="male" name="gender" value="Male" required>
                    <label for="male">Male</label>
                    
                    <input type="radio" id="female" name="gender" value="Female">
                    <label for="female">Female</label>
                    
                    <input type="radio" id="other" name="gender" value="Other">
                    <label for="other">Other</label>
                </td>
            </tr>
            <tr>
                <td><label for="qualification">Highest Qualification:</label></td>
                <td>
                    <select id="qualification" name="qualification" required>
                        <option value="">-- Select Qualification --</option>
                        <option value="High School">High School</option>
                        <option value="Diploma">Diploma</option>
                        <option value="Bachelor's Degree">Bachelor's Degree</option>
                        <option value="Master's Degree">Master's Degree</option>
                        <option value="Doctorate (Ph.D.)">Doctorate (Ph.D.)</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><label for="skills">Skills:</label></td>
                <td><textarea id="skills" name="skills" rows="3" cols="30" placeholder="e.g., HTML, Python, Project Management" required></textarea></td>
            </tr>
            <tr>
                <td><label for="experience">Years of Experience:</label></td>
                <td><input type="number" id="experience" name="experience" min="0" step="0.5" required></td>
            </tr>
            <tr>
                <td><label for="salary">Expected Salary:</label></td>
                <td><input type="number" id="salary" name="salary" min="0" placeholder="In USD or local currency" required></td>
            </tr>
            <tr>
                <td><label for="resume">Resume Upload:</label></td>
                <td><input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx" required></td>
            </tr>
            <tr>
                <td><label for="linkedin">LinkedIn Profile URL:</label></td>
                <td><input type="url" id="linkedin" name="linkedin" placeholder="https://www.linkedin.com/in/username" required></td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Submit Application">
                    <input type="reset" value="Reset Form">
                </td>
            </tr>
        </table>
    </form>
    </center>

</body>
</html>
