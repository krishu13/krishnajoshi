<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>college form</title>
</head>
<body>
    <table border="2" cellpadding="10" align="center" width="65%" bgcolor="pink">
        <tr>
            <th><h3><u>certificate from</u></h3></th>
        </tr>
        <tr>
            <td align="center">
                <form>
                    <label>full name:</label>
                    <input type="text" placeholder="enter full name" required>
                    <br><br>
                    <label>email:</label>
                    <input type="text" placeholder="enter your email" required>
                    <br><br>
                    <label>mobile no:</label>
                    <input type="tel" placeholder="enter your mobile no" required >
                    <br><br>
                    <label>cours:</label>
                    <input type="checkbox" name="BCA">BCA
                    <input type="checkbox" name="B.COM">B.COM
                    <input type="checkbox" name="BBA">BBA
                    <input type="checkbox" name="BA">BA
                    <br><br>
                    <label>qualification:</label>
                    <input type="text" placeholder="enter qualification" >
                    <br><br>
                    <label>college name:</label>
                    <input type="text" placeholder="enter your college name" required>
                    <br><br>
                    <button type="submit">register</button>

                </form>
            </td>
        </tr>
    </table>
</body>
</html>
