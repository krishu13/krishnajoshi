<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>multipal files</title>
</head>
<body>
    <form action="succes.html" method="post">
        <table border="1" cellpadding="10" width="50%" align="center">
            <tr>
                <th bgcolor="sky bule">
                    compose email

                </th>
            </tr>
            <tr>
                <td>
                    <input type="email" name="email" id="email" placeholder="enter your email">
                </td>
            </tr>
            <tr>
                <td>
                    attchmnet
                </td>
            </tr>
            <tr>
                <td>
                    <input type="file" name="attchmnet" id="attchmnet"
                    multiple accept=".jpeg,.png,.doc,.html,.xls,.docx,.ppt,.pdf,.pptx">
                </td>
            </tr>
            <tr>
                <td>
                    <textarea name="address" id="address" required
                    placeholder="your address">

                    </textarea>
                </td>
            </tr>
            <tr>
                <td>
                    <button type="submit">send email</button>
                    <button type="reset">clear all</button>
                </td>
            </tr>
        </table>

    </form>
    
</body>
</html>
